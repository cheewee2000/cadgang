# The iPhone and iPad app. ios/build.sh generates the Xcode project from this (xcodegen) and builds it.
name: cadgang
options:
  bundleIdPrefix: com.cwandt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: L6DVQR8JB9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: ${VERSION}   # package.json's, passed by build.sh
    CURRENT_PROJECT_VERSION: ${BUILD}
targets:
  cadgang:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: find.html
        buildPhase: resources
      - path: Assets.xcassets
      - path: ../web/fonts/SpaceMono-Regular.ttf
        buildPhase: resources
      - path: ../mac/AppIcon.icon
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CADgang
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: CADgang shows what the CADgang app on your Mac has open.
        NSBonjourServices: [_companion-link._tcp, _airplay._tcp]   # how Macs are found, see App.swift
        NSAppTransportSecurity:   # the Mac's server is plain http on the local network
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.cadgang.ios
        PRODUCT_NAME: cadgang
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
