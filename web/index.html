<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cadgang</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="cwandt.css" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">CW&amp;T&nbsp;·&nbsp;CADGANG</div>
      <span class="proj-sep">/</span>
      <span id="projectName" class="project-name" title="Current project — click to save as / rename">untitled</span>
    </div>
    <div class="toolbar">
      <button id="saveBtn" class="ghost" title="Save this model to the server">Save</button>
      <button id="openBtn" class="ghost" title="Open a saved model">Open</button>
      <span class="sep"></span>
      <label>res
        <input id="resolution" type="range" min="24" max="180" value="90" />
        <span id="resolutionValue">90</span>
      </label>
      <input id="importFile" type="file" accept=".step,.stp,.iges,.igs,.brep" class="hidden" />
      <button id="clearDoc" class="ghost" title="New file — clears the current model">New</button>
      <span class="sep"></span>
      <button id="splitToggle" class="ghost" title="Switch between horizontal and vertical split">STACK</button>
      <button id="themeToggle" class="ghost" title="Toggle light / dark">DARK</button>
      <button id="colorToggle" class="ghost" title="Toggle per-part color / stainless">COLOR</button>
      <span id="status" class="status"></span>
      <span class="version"><span class="idcode">CWT_SW_CADGANG_0602</span> <span class="idver">v0.6.2</span></span>
    </div>
  </header>

  <main>
    <aside id="panel">
      <div id="varsBar">
        <span class="vars-label">VARS</span>
        <span id="varsChips"></span>
        <input id="varAdd" type="text" placeholder="name = value" autocomplete="off" spellcheck="false" />
      </div>
      <div id="graph">
        <div id="world">
          <svg id="wires" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <button id="arrangeBtn" class="ghost graph-tool" title="Lay blocks out in a tidy dependency grid">Arrange</button>
        <div class="graph-hint">double-click to add a block · drag to select · right-drag to pan · scroll to zoom · ⌘C/⌘V copy/paste · ⌘Z undo</div>
      </div>
    </aside>
    <div id="dragbar" title="Drag to resize"></div>
    <div id="viewport">
      <div id="meshProgress"><div id="meshProgressFill"></div></div>
      <button id="pickFace" class="ghost vp-tool hidden" title="Pick a STEP face in the 3D view and extrude it">Pick face</button>
    </div>
  </main>

  <footer>
    <div id="formula" title="Click to expand the model formula"></div>
    <div id="stats"></div>
  </footer>

  <!-- node creation menu -->
  <div id="createMenu" class="popup hidden">
    <input id="createFilter" type="text" placeholder="search blocks…" autocomplete="off" />
    <div id="createList"></div>
  </div>

  <!-- modal backdrop shared by save/open -->
  <div id="modalBackdrop" class="hidden">
    <div id="saveModal" class="modal hidden">
      <h3>Save model</h3>
      <input id="saveName" type="text" placeholder="model name" autocomplete="off" />
      <div class="modal-actions">
        <button id="saveCancel">Cancel</button>
        <button id="saveConfirm" class="primary">Save</button>
      </div>
    </div>
    <div id="openModal" class="modal hidden">
      <h3>Open model</h3>
      <div id="fileList" class="file-list"></div>
      <div class="modal-actions">
        <button id="openCancel">Close</button>
      </div>
    </div>
    <div id="formulaModal" class="modal modal-wide hidden">
      <div class="modal-head">
        <h3>Model formula</h3>
        <button id="formulaCopy" class="ghost" title="Copy as plain text">Copy</button>
      </div>
      <pre id="formulaPre"></pre>
      <div class="modal-actions">
        <button id="formulaClose">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
