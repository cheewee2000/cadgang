<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CADgang · view</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="cwandt.css" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">CW&amp;T&nbsp;·&nbsp;CADGANG</div>
      <span class="proj-sep">/</span>
      <span class="project-name" id="fileName" title="Open a file: drop it here, ⌘O, or double-click it in Finder">view</span>
    </div>
    <div class="toolbar">
      <button id="openBtn" class="ghost" title="Open a file (⌘O)">Open</button>
      <button id="newBtn" class="ghost" title="New window, for another file with its own markups">New</button>
      <button id="defaultBtn" class="ghost" hidden title="Make CADgang the Finder's default app for every CAD file type it reads">Default</button>
      <input id="fileInput" type="file" multiple hidden
        accept=".step,.stp,.iges,.igs,.brep,.stl,.obj,.ply,.3mf,.gltf,.glb,.fbx,.dxf" />
      <button id="fitBtn" class="ghost" title="Fit the model (F)">Fit</button>
      <button id="sideBtn" class="ghost" hidden title="Flip the drawing over">Flip</button>
      <span class="sep"></span>
      <button id="edgesBtn" class="ghost on" title="Edges (E)">Edges</button>
      <button id="wireBtn" class="ghost" title="Wireframe (W)">Wire</button>
      <button id="gridBtn" class="ghost on" title="Grid (G)">Grid</button>
      <button id="colorBtn" class="ghost" title="A colour per body or layer">Color</button>
      <button id="orthoBtn" class="ghost" title="Orthographic (O)">Ortho</button>
      <select id="look" class="ghost" title="Render preset">
        <option value="shaded">Shaded</option><option value="metal">Metal</option><option value="plastic">Plastic</option>
        <option value="glass">Glass</option><option value="xray">X-ray</option><option value="normals">Normals</option>
      </select>
      <span class="sep"></span>
      <button id="measureBtn" class="ghost" title="Measure: snaps to ends, midpoints, centres, quadrants; click an edge for its length, a circle for ⌀, two faces for their gap; ⌥ free point, ⇧ no axis snap (M, Esc to stop)">Measure</button>
      <span class="sep"></span>
      <span class="sect" id="sectAxis" data-axis="" title="Section plane: pick an axis, slide it or drag the cut face, flip the kept side">Section
        <button class="ghost on" data-sect="">Off</button><button class="ghost" data-sect="x">X</button><button class="ghost" data-sect="y">Y</button><button class="ghost" data-sect="z">Z</button>
        <input id="sectPos" type="range" min="0" max="1000" value="500" disabled />
        <button id="sectFlip" class="ghost" title="Invert which side is kept" disabled>Invert</button>
      </span>
      <span class="sep"></span>
      <label class="sect" title="Slide the bodies apart from the assembly centre">Explode
        <input id="explode" type="range" min="0" max="100" value="0" />
      </label>
      <span class="sep"></span>
      <button id="themeToggle" class="ghost" title="Toggle light / dark">DARK</button>
      <span class="version"><span class="idcode">CWT_SW_CADGANG_VIEW</span> <span class="idver" id="version"></span></span>
    </div>
  </header>

  <main>
    <div id="viewport">
      <div id="bodies" class="bodies" hidden title="Bodies: tick to show, click a name to see only it, shift-click for all"></div>
      <div id="measureLayer" class="measure-layer"></div>
      <div id="markupLayer" class="measure-layer"></div>
      <div id="markupTools" class="markup-tools" title="Markup: anchored on the model; Claude sees it through cadgang_screen">
        <button class="ghost" data-tool="pen" title="Draw on the model">PEN</button>
        <button class="ghost" data-tool="arrow" title="Point at something">ARROW</button>
        <button class="ghost" data-tool="note" title="Pin a note">NOTE</button>
        <button class="ghost" data-tool="erase" title="Erase one mark">ERASE</button>
        <button class="ghost" data-clear="1" title="Clear all markup">CLEAR</button>
      </div>
      <div id="drop" class="drop">
        <div id="loadError" class="load-error"></div>
        <div>Drop a STEP, IGES, BREP, STL, OBJ, PLY, 3MF, glTF, FBX or DXF file here.</div>
        <div class="drop-hint">Scroll: rotate · Shift-scroll: pan · Pinch: zoom · Double-click: centre · Right-click: menu and hotkeys · ⌘Z undo · DXF: pan, spin to turn, B to flip over</div>
      </div>
    </div>
  </main>

  <footer>
    <div id="measures"></div>
    <span id="status" class="status"></span>
    <div id="stats"></div>
  </footer>

  <script type="module" src="view.js"></script>
</body>
</html>
