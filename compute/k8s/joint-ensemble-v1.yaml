apiVersion: batch/v1
kind: Job
metadata:
  name: cadgang-joint-ensemble-v1
  namespace: cadgang-compute
  labels: {app: cadgang-joint-ensemble-v1}
spec:
  # Nine hours in all, replacements included: the most this Job can hold a node for.
  activeDeadlineSeconds: 32400
  backoffLimit: 0
  podReplacementPolicy: Failed
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions: [{type: DisruptionTarget, status: "True"}]
      - action: Ignore
        onExitCodes: {operator: In, values: [143]}
  template:
    metadata:
      labels: {app: cadgang-joint-ensemble-v1}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      containers:
        - name: train
          image: rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0
          workingDir: /workspace
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              git config --global --add safe.directory '*'
              git -C "$WORK/repo" fetch origin "$REF"
              # A private clone: the shared checkout stays where the other jobs left it.
              rm -rf /tmp/repo && git clone -q --shared "$WORK/repo" /tmp/repo && cd /tmp/repo
              git checkout -q "$COMMIT"
              test "$(git rev-parse HEAD)" = "$COMMIT"
              python -m pip install --no-cache-dir scipy onnx onnxruntime
              exec bash compute/research/run-joint-ensemble.sh
          env:
            - {name: WORK, value: /mnt/shared/cadgang}
            - {name: ROOT, value: /mnt/shared/cadgang/joint-ensemble-v1}
            - {name: REF, value: compute/joint-ensemble}
            - {name: COMMIT, value: 5b398d4ee8375c435897f6fcc8d143d54fdca2a1}
            - {name: PYTHONUNBUFFERED, value: "1"}
          resources:
            requests: {cpu: "32", memory: 128Gi, amd.com/gpu: "8"}
            limits: {cpu: "64", memory: 256Gi, amd.com/gpu: "8"}
          volumeMounts:
            - {name: shared, mountPath: /mnt/shared}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: shared
          hostPath: {path: /mnt/shared, type: Directory}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 32Gi}
